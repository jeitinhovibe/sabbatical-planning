name: Deploy site

# Publishes the static site to Cloudflare Workers (static assets):
#   main        -> https://sabbatical.jeitinhovibe.online
#   pull request -> https://pr-<number>.sabbatical.jeitinhovibe.online
#
# The site is files only — no server code — so the job stages `_site/` with
# `./deploy.sh stage` and lets wrangler upload it. Previews are Cloudflare
# Previews: one per PR, named `pr-<number>`, deleted when the PR closes. That
# preview pipeline lives in the shared org workflow
# (`jeitinhovibe/.github`), using the `stateless` profile.
#
# Secret (repo settings): CLOUDFLARE_API_TOKEN with Workers Scripts, Workers
# Routes and Zone read. The account id is committed in `wrangler.jsonc`.
# Fork PRs are skipped — they do not get the secrets.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify dist/ matches sources
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `dist/` is committed, so a stale bundle is a silent production bug.
      - name: Rebuild the bundles
        run: ./build.sh

      - name: Fail if a bundle is stale
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date — run ./build.sh and commit the result."
            exit 1
          fi

  deploy:
    name: Deploy main
    needs: verify
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: ./deploy.sh stage

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy

      - name: Smoke test the live site
        run: |
          url=https://sabbatical.jeitinhovibe.online
          code=000
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/")
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "GET / -> $code"
          [ "$code" = "200" ] || exit 1
          # Every local asset the page asks for must resolve.
          assets=$(grep -oE '(src|href)="[^":]+\.(js|css)"' index.html | sed -E 's/.*="([^"]+)"/\1/')
          [ -n "$assets" ] || { echo "no local assets found in index.html"; exit 1; }
          for asset in $assets; do
            curl -fsS -o /dev/null "$url/$asset" || exit 1
            echo "ok $asset"
          done

  preview:
    name: Deploy PR preview
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: jeitinhovibe/.github/.github/workflows/pr-preview.yml@main
    with:
      profile: stateless
      prepare_command: ./deploy.sh stage
      note: "Deployed from this pull request's build."
    secrets: inherit

  cleanup-preview:
    name: Remove PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: jeitinhovibe/.github/.github/workflows/pr-preview.yml@main
    with:
      profile: stateless
    secrets: inherit
